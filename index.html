<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الباركود المتزامن مع جوجل شيت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- مكتبة قراءة ملفات Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .highlight-row {
            background-color: #fef08a !important;
            transition: background-color 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4">

    <div class="max-w-7xl mx-auto bg-white shadow-lg rounded-xl p-6">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">📦 نظام تتبع الباركود (رفع Excel + فحص وتلوين)</h1>
            <div class="mt-4 md:mt-0 flex flex-wrap gap-2 items-center">
                <!-- زر رفع ملف Excel وتحديث digylog_Reteur -->
                <label class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-medium text-sm cursor-pointer shadow">
                    📁 رفع ملف Excel إلى (digylog_Reteur)
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">
                </label>
                <button onclick="fetchGoogleSheetData()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 font-medium text-sm">🔄 تحديث البيانات</button>
            </div>
        </header>

        <!-- قسم البحث والمسح -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-gray-50 p-4 rounded-lg border">
                <label class="block text-sm font-medium text-gray-700 mb-2">🔍 أدخل أو امسح الكود (Barcode Scanner / يدوي):</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="امسح الباركود هنا..." class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" autofocus>
                    <button onclick="searchBarcode()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium">بحث وتلوين</button>
                </div>
                <p id="statusMsg" class="mt-2 text-sm text-gray-600 font-medium">جاري جلب البيانات والتزامن...</p>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg border flex flex-col items-center">
                <span class="text-sm font-medium text-gray-700 mb-2">📷 مسح الباركود بالكاميرا:</span>
                <button onclick="startScanner()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm mb-2">فتح الكاميرا</button>
                <div id="reader" style="width: 100%; max-width: 300px; display: none;"></div>
            </div>
        </div>

        <!-- جدول البيانات -->
        <div class="overflow-x-auto border rounded-lg max-h-[500px]">
            <table id="dataTable" class="min-w-full divide-y divide-gray-200 text-right">
                <thead class="bg-gray-200 sticky top-0">
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <script>
        // رابط الـ CSV لجوجل شيت (تأكد أنه يعرض بيانات الورقة المطلوبة digylog_Reteur أو الشيت الحالي)
        const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTKtxEDlWSOouyNRAYvo_c4TVRf7IUa0KqoOtTrRcnFodzF3npXefxZDB5DVuZ64Oa28py5RHfnN5Rz/pub?output=csv";
        const scriptURL = "https://script.google.com/macros/s/AKfycbz9HE6FI_vgOarJ8hvSMjgLslrn-_JXHEmONwPPyfmSBquCD9_KCAnnq6V4NCTOl11FAw/exec";
        
        let tableData = [];
        let headers = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchGoogleSheetData();
        });

        // مولد الأصوات التنبيهية (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function fetchGoogleSheetData() {
            const msg = document.getElementById('statusMsg');
            msg.innerText = "جاري جلب أحدث البيانات من Google Sheets...";
            msg.className = "mt-2 text-sm text-blue-600 font-medium";

            Papa.parse(sheetCSVUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    tableData = results.data;
                    headers = results.meta.fields;
                    renderTable(tableData, headers);
                    msg.innerText = `تم جلب ${tableData.length} سجل بنجاح من جوجل شيت!`;
                    msg.className = "mt-2 text-sm text-green-600 font-semibold";
                },
                error: function(err) {
                    msg.innerText = "حدث خطأ أثناء الاتصال بجوجل شيت.";
                    msg.className = "mt-2 text-sm text-red-600 font-semibold";
                }
            });
        }

        // دالة قراءة ملف الـ Excel ورفع بياناته لجوجل شيت أولاً
        function handleExcelUpload(event) {
            const file = event.target.files[0];
            const msg = document.getElementById('statusMsg');
            if (!file) return;

            msg.innerText = "جاري قراءة ملف Excel ورفعه إلى جوجل شيت (digylog_Reteur)...";
            msg.className = "mt-2 text-sm text-indigo-600 font-medium";

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonRows.length === 0) {
                        alert("الملف فارغ أو لا يحتوي على بيانات صحيحة.");
                        return;
                    }

                    // إرسال البيانات إلى Google Apps Script لحفظها في شيت digylog_Reteur
                    fetch(scriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: "uploadExcel",
                            sheetName: "digylog_Reteur",
                            rows: jsonRows
                        })
                    }).then(() => {
                        msg.innerText = `✨ تم رفع الملف إلى جوجل شيت بنجاح! جاري تحديث الجدول...`;
                        msg.className = "mt-2 text-sm text-green-600 font-bold";
                        playSound('success');

                        // الانتظار قليلاً ثم جلب البيانات المحدثة مباشرة من جوجل شيت لضمان التطابق
                        setTimeout(() => {
                            fetchGoogleSheetData();
                        }, 2000);

                    }).catch(err => {
                        console.error(err);
                        msg.innerText = "حدث خطأ أثناء إرسال البيانات لجوجل شيت.";
                        msg.className = "mt-2 text-sm text-red-600 font-bold";
                        playSound('error');
                    });

                } catch (error) {
                    console.error(error);
                    msg.innerText = "حدث خطأ أثناء قراءة ملف الـ Excel.";
                    msg.className = "mt-2 text-sm text-red-600 font-bold";
                    playSound('error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderTable(data, hdrs) {
            const headerRow = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            
            headerRow.innerHTML = '';
            tbody.innerHTML = '';

            hdrs.forEach(h => {
                const th = document.createElement('th');
                th.className = "px-6 py-3 text-xs font-medium text-gray-700 uppercase tracking-wider";
                th.innerText = h;
                headerRow.appendChild(th);
            });

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                tr.className = index % 2 === 0 ? "bg-white" : "bg-gray-50";

                hdrs.forEach(h => {
                    const td = document.createElement('td');
                    td.className = "px-6 py-4 whitespace-nowrap text-sm text-gray-900";
                    td.innerText = row[h] || '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function searchBarcode() {
            const query = document.getElementById('searchInput').value.trim();
            const msg = document.getElementById('statusMsg');

            if (!query) {
                msg.innerText = "الرجاء إدخال أو مسح كود باركود أولاً.";
                msg.className = "mt-2 text-sm text-red-600";
                playSound('error');
                return;
            }

            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('highlight-row'));

            let foundIndex = -1;
            tableData.forEach((row, index) => {
                for (let key in row) {
                    if (row[key] && row[key].toString().trim().toLowerCase() === query.toLowerCase()) {
                        foundIndex = index;
                        break;
                    }
                }
            });

            if (foundIndex !== -1) {
                const targetRow = document.getElementById(`row-${foundIndex}`);
                if (targetRow) {
                    targetRow.classList.add('highlight-row');
                    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    msg.innerText = `✨ تم العثور على الكود (${query}) وتلوين السطر محلياً وفي جوجل شيت!`;
                    msg.className = "mt-2 text-sm text-green-600 font-bold";
                    
                    playSound('success');

                    // إرسال طلب تلوين السطر إلى Google Apps Script
                    fetch(`${scriptURL}?code=${encodeURIComponent(query)}`, { mode: 'no-cors' })
                        .then(() => console.log('تم إرسال طلب التلوين إلى Google Apps Script'))
                        .catch(err => console.error('خطأ في الاتصال بالسكريبت:', err));
                }
            } else {
                msg.innerText = `❌ عذراً، الكود (${query}) غير موجود في جدول جوجل شيت.`;
                msg.className = "mt-2 text-sm text-red-600 font-bold";
                playSound('error');
            }
            
            const inputField = document.getElementById('searchInput');
            inputField.value = '';
            inputField.focus();
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchBarcode();
            }
        });

        function startScanner() {
            const readerDiv = document.getElementById('reader');
            readerDiv.style.display = 'block';
            
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    document.getElementById('searchInput').value = decodedText;
                    searchBarcode();
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = 'none';
                    }).catch(err => console.log(err));
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("تعذر تشغيل الكاميرا.");
            });
        }
    </script>
</body>
</html>
