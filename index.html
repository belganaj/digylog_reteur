<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مسح وتتبع الباركود - Adrar Optic / Log</title>
    <!-- Tailwind CSS للتنسيق السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة قراءة الباركود عبر الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- مكتبة قراءة ملفات CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .highlight-row {
            background-color: #fef08a !important; /* لون أصفر مميز للسطر المطابق */
            transition: background-color 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4">

    <div class="max-w-7xl mx-auto bg-white shadow-lg rounded-xl p-6">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">📦 نظام تتبع ومسح باركود الطلبيات</h1>
            <div class="mt-4 md:mt-0 flex gap-2">
                <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            </div>
        </header>

        <!-- قسم البحث والمسح -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- البحث اليدوي / جهاز الباركود -->
            <div class="bg-gray-50 p-4 rounded-lg border">
                <label class="block text-sm font-medium text-gray-700 mb-2">🔍 أدخل أو امسح الكود (Barcode Scanner / يدوي):</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="مثال: SB07BD24T" class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchBarcode()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium">بحث وتلوين</button>
                </div>
                <p id="statusMsg" class="mt-2 text-sm text-gray-600"></p>
            </div>

            <!-- تشغيل كاميرا الهاتف لمسح الباركود -->
            <div class="bg-gray-50 p-4 rounded-lg border flex flex-col items-center">
                <span class="text-sm font-medium text-gray-700 mb-2">📷 مسح الباركود بالكاميرا:</span>
                <button onclick="startScanner()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm mb-2">فتح الكاميرا</button>
                <div id="reader" style="width: 100%; max-width: 300px; display: none;"></div>
            </div>
        </div>

        <!-- جدول البيانات -->
        <div class="overflow-x-auto border rounded-lg max-h-[500px]">
            <table id="dataTable" class="min-w-full divide-y divide-gray-200 text-right">
                <thead class="bg-gray-200 sticky top-0">
                    <tr id="tableHeader">
                        <!-- يتم تعبئة العناوين تلقائياً -->
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                    <!-- يتم تعبئة البيانات تلقائياً -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let tableData = [];
        let headers = [];

        // تحميل ملف CSV الافتراضي أو المرفق تلقائياً إذا وجد، أو انتظار رفع المستخدم
        window.addEventListener('DOMContentLoaded', () => {
            // تحميل ملف افتراضي تجريبي من البيانات المرفقة
            loadDefaultData();
        });

        function loadDefaultData() {
            // بيانات تجريبية مطابقة لملف digylog_Reteur.csv المرفق
            const sampleCSV = `Code,Ville,Statut,Raison,Date,Heure,Qte,D1,D2,D3,Note
SB07BD24T,Tafraout,Annulée,Toujours injoignable,31/08/2026,01:00:00,4,32 days,14 days,Livraison automatique dans 1 jour,
SB432680M,Mirleft,Refusée,Article différent a la présentation du site,18/09/2026,01:00:00,2,10 days,8 days,Livraison automatique dans 6 jours,
S30E08D3M,Mirleft,Refusée,Mauvais qualité / Non conforme,22/09/2026,02:00:00,4,11 days,5 days,10 jours,
FC3F9F03AL,Lakhssas,Annulée,Toujours injoignable,23/09/2026,11:30:00,4,12 days,5 days,10 jours,
EC-SD027908T,Tiznit,Récupérée,,24/09/2026,14:51:00,2,3 days,3 days,12 days,`;
            
            parseAndDisplayCSV(sampleCSV);
        }

        // رفع ملف CSV جديد
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        tableData = results.data;
                        headers = results.meta.fields;
                        renderTable(tableData, headers);
                        document.getElementById('statusMsg').innerText = "تم تحميل الملف بنجاح!";
                        document.getElementById('statusMsg').className = "mt-2 text-sm text-green-600 font-semibold";
                    }
                });
            }
        });

        function parseAndDisplayCSV(csvText) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    tableData = results.data;
                    headers = results.meta.fields;
                    renderTable(tableData, headers);
                }
            });
        }

        function renderTable(data, hdrs) {
            const headerRow = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            
            headerRow.innerHTML = '';
            tbody.innerHTML = '';

            // إنشاء الأعمدة
            hdrs.forEach(h => {
                const th = document.createElement('th');
                th.className = "px-6 py-3 text-xs font-medium text-gray-700 uppercase tracking-wider";
                th.innerText = h;
                headerRow.appendChild(th);
            });

            // إنشاء الصفوف
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                tr.className = index % 2 === 0 ? "bg-white" : "bg-gray-50";

                hdrs.forEach(h => {
                    const td = document.createElement('td');
                    td.className = "px-6 py-4 whitespace-nowrap text-sm text-gray-900";
                    td.innerText = row[h] || '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // دالة البحث والتلوين للباركود
        function searchBarcode() {
            const query = document.getElementById('searchInput').value.trim();
            const msg = document.getElementById('statusMsg');

            if (!query) {
                msg.innerText = "الرجاء إدخال أو مسح كود باركود أولاً.";
                msg.className = "mt-2 text-sm text-red-600";
                return;
            }

            // إزالة التلوين السابق
            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('highlight-row'));

            let foundIndex = -1;
            tableData.forEach((row, index) => {
                // البحث في عمود Code (أو مطابقة تامة)
                if (row['Code'] && row['Code'].toString().toLowerCase() === query.toLowerCase()) {
                    foundIndex = index;
                }
            });

            if (foundIndex !== -1) {
                const targetRow = document.getElementById(`row-${foundIndex}`);
                if (targetRow) {
                    targetRow.classList.add('highlight-row');
                    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    msg.innerText = `تم العثور على الكود (${query}) وتلوين السطر بنجاح في الجدول!`;
                    msg.className = "mt-2 text-sm text-green-600 font-bold";
                }
            } else {
                msg.innerText = `عذراً، الكود (${query}) غير موجود في البيانات.`;
                msg.className = "mt-2 text-sm text-red-600 font-bold";
            }
        }

        // دعم الضغط على زر Enter في حقل البحث (مناسب لأجهزة قراءة الباركود السريعة)
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchBarcode();
            }
        });

        // تشغيل كاميرا الهاتف لمسح الباركود
        function startScanner() {
            const readerDiv = document.getElementById('reader');
            readerDiv.style.display = 'block';
            
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText, decodedResult) => {
                    document.getElementById('searchInput').value = decodedText;
                    searchBarcode();
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = 'none';
                    }).catch(err => console.log(err));
                },
                (errorMessage) => {
                    // أخطاء المسح المؤقتة نتجاهلها لتجنب الإزعاج
                }
            ).catch(err => {
                alert("تعذر تشغيل الكاميرا. تأكد من إعطاء الصلاحيات اللازمة.");
            });
        }
    </script>
</body>
</html>
